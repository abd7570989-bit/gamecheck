# Checks every push. The Windows job builds the real app and installer on a real
# Windows machine, starts the app in smoke-test mode, then installs it without admin
# rights, starts the installed copy and uninstalls it.
name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  linux:
    name: Linux checks
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install WebKitGTK (needed to compile Tauri on Linux)
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libayatana-appindicator3-dev
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm --filter @gamecheck/desktop typecheck
      - name: Frontend tests
        run: pnpm --filter @gamecheck/desktop test
      - name: Frontend build
        run: pnpm --filter @gamecheck/desktop exec vite build
      - name: Rust format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Rust tests
        run: cargo test --workspace

  windows:
    name: Windows build and smoke test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: pnpm install --frozen-lockfile
      - name: Frontend tests
        run: pnpm --filter @gamecheck/desktop test
      - name: Rust tests
        run: cargo test --workspace
      - name: Build app and installer
        run: pnpm --filter @gamecheck/desktop tauri build
      - name: Smoke test (built executable)
        shell: pwsh
        run: ./scripts/smoke-test.ps1 -Exe target/release/gamecheck.exe
      - name: Install without admin, smoke test, uninstall
        shell: pwsh
        run: ./scripts/install-test.ps1 -InstallerGlob "target/release/bundle/nsis/*-setup.exe"
      - name: Collect logs
        if: always()
        shell: pwsh
        run: |
          $logs = Join-Path $env:LOCALAPPDATA "com.gamecheck.desktop\logs"
          if (Test-Path $logs) { Get-ChildItem $logs | ForEach-Object { Write-Host "== $($_.Name)"; Get-Content $_.FullName -Tail 50 } }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: GameCheck-windows-installer
          path: |
            target/release/bundle/nsis/*-setup.exe
          if-no-files-found: error
