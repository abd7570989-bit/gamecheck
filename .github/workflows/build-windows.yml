# Builds GameCheck.exe on a real Windows machine, tests it, and uploads it.
# Runs on every push; pushing a tag like v1.0.0 also publishes a GitHub Release with the EXE.
name: Build Windows EXE

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install build and test tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
          npm install --no-save playwright@1.48.2
          npx playwright install chromium

      - name: Unit tests (on Windows, including the real hardware scan)
        run: python -m pytest -q

      - name: Build EXE
        run: pyinstaller --noconfirm gamecheck.spec

      - name: Test the EXE
        shell: pwsh
        run: |
          # On failure, the output is also attached as an annotation so it is visible
          # on the run summary page without opening the full log.
          function Check($label, [scriptblock]$cmd) {
            $out = & $cmd 2>&1 | Out-String
            $code = $LASTEXITCODE
            Write-Host $out
            if ($code -ne 0) {
              $tail = ($out -split "`n" | Select-Object -Last 40) -join "%0A"
              Write-Host "::error title=$label failed (exit $code)::$tail"
              exit 1
            }
          }
          Check "GameCheck --version" { ./dist/GameCheck.exe --version }
          Check "GameCheck --report" { ./dist/GameCheck.exe --report }
          Check "UI test against EXE" { node tests/ui/ui_test.js ./dist/GameCheck.exe }

      - name: Checksum
        shell: pwsh
        run: (Get-FileHash dist/GameCheck.exe -Algorithm SHA256).Hash | Out-File -Encoding ascii dist/GameCheck.exe.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: GameCheck-windows
          path: |
            dist/GameCheck.exe
            dist/GameCheck.exe.sha256

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/GameCheck.exe
            dist/GameCheck.exe.sha256
